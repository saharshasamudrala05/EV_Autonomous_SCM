version: '3.8'

# ═══════════════════════════════════════════════════════════
#  NEXUS-SCM  |  Data Foundation Infrastructure
#  Starts: PostgreSQL (port 5433) + Kafka (9093) + Kafka UI
#  Run: docker-compose up -d
# ═══════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 15 ── Single Source of Truth ────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus123
      POSTGRES_DB: nexus_scm
    ports:
      - "5433:5432"          # 5433 avoids conflict with local PG on 5432
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_scm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network

  # ── Zookeeper ── Kafka Coordination ───────────────────────
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: nexus_zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - nexus_network

  # ── Apache Kafka ── Event Stream Broker ────────────────────
  kafka:
    image: bitnami/kafka:3.6
    container_name: nexus_kafka
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9093:9093"          # External access port for Python clients
    depends_on:
      - zookeeper
    networks:
      - nexus_network

  # ── Kafka UI ── Visual Monitoring Dashboard ─────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"          # Visit http://localhost:8090
    depends_on:
      - kafka
    networks:
      - nexus_network

volumes:
  nexus_postgres_data:
    driver: local

networks:
  nexus_network:
    driver: bridge
